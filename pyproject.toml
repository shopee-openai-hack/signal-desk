[project]
name = "hackathon-agent-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "openai>=1.54,<2", "uvicorn[standard]>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
